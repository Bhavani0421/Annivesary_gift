```html
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Our Love Story 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Poppins',sans-serif;
background:linear-gradient(135deg,#000,#1a001f,#000);
color:white;
text-align:center;
overflow:hidden;
}

/* SECTION */
.section{
display:none;
height:100vh;
justify-content:center;
align-items:center;
flex-direction:column;
animation:fadeIn 1s ease;
}
.active{display:flex;}

@keyframes fadeIn{
from{opacity:0;transform:scale(.95)}
to{opacity:1;transform:scale(1)}
}

/* HEADINGS */
h1,h2{
text-shadow:0 0 20px #ff4d9d,0 0 40px #ff0080;
}

/* BUTTON */
button{
padding:14px 35px;
border:none;
border-radius:40px;
cursor:pointer;
background:linear-gradient(45deg,#ff0080,#ff4d6d);
color:white;
font-size:17px;
font-weight:bold;
box-shadow:0 0 20px #ff4d9d;
transition:.4s;
margin-top:20px;
}
button:hover{
transform:scale(1.1);
box-shadow:0 0 40px #ff0080,0 0 80px #ff4d9d;
}

/* INPUT */
input{
padding:14px;
border-radius:40px;
border:none;
text-align:center;
margin-top:20px;
width:250px;
font-size:16px;
background:rgba(255,255,255,0.1);
color:white;
outline:none;
}

/* QUIZ BOX */
.quiz-box{
padding:40px;
border-radius:25px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(15px);
border:2px solid rgba(255,0,128,0.5);
box-shadow:0 0 40px #ff0080;
}

/* STARS */
.star{
position:fixed;
font-size:22px;
pointer-events:none;
transition:1s ease-out;
}

/* GAME GRID */
.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
max-width:360px;
margin:auto;
}

.card{
width:70px;
height:70px;
background:rgba(255,255,255,0.1);
border-radius:20px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
overflow:hidden;
}
.card::before{
content:"💖";
font-size:25px;
}
.card img{
width:100%;
height:100%;
object-fit:cover;
display:none;
}
.card.open img{display:block}
.card.open::before{display:none}

/* FINAL PHOTO */
.photo{
width:260px;
border-radius:25px;
margin-top:25px;
box-shadow:0 0 40px #ff0080;
}

/* ANNIVERSARY TEXT */
#anniversary h1{
font-size:38px;
}
</style>
</head>

<body>

<!-- MUSIC -->
<audio id="bgMusic" loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<!-- INTRO -->
<div id="intro" class="section active">
<h1>This is not just a website…</h1>
<h2>This is Our Love Story 💖</h2>
</div>

<!-- ENTER -->
<div id="enter" class="section">
<h1>Ready Jeeva? 💍</h1>
<button onclick="startQuiz()">Enter Our Love Journey</button>
</div>

<!-- QUIZ -->
<div id="quiz" class="section">
<div class="quiz-box">
<h2 id="questionText"></h2>
<input id="answerInput" placeholder="Type your answer...">
<button onclick="nextQuestion()">Next ❤️</button>
</div>
</div>

<!-- BLAST -->
<div id="blast" class="section">
<h1 id="blastText"></h1>
</div>

<!-- GAME -->
<div id="game" class="section">
<h2>Match Our Memories 💞</h2>
<div class="grid" id="board"></div>
</div>

<!-- ANNIVERSARY -->
<div id="anniversary" class="section">
<h1>Happy 1st Wedding Anniversary 💍❤️</h1>
</div>

<!-- FINAL -->
<div id="loveFinal" class="section">
<h1>Forever Us 💖</h1>

<p>
One year down, forever to go ❤️<br><br>
You are my today and all of my tomorrows 💍
</p>

<img id="slideshow" class="photo" src="img1.jpeg">

<br>

<button onclick="shareLove()">Share Our Love 💌</button>
</div>

<script>

/* PLAY MUSIC */
document.addEventListener("click",()=>{
document.getElementById("bgMusic").play();
});

/* FLOW */
setTimeout(()=>show("enter"),3000);

function show(id){
document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
document.getElementById(id).classList.add('active');

if(id==="loveFinal"){
fullBlast();
}
}

/* QUIZ */
const questions=[
{q:"My Favourite Color?",a:"blue"},
{q:"First Meeting Date?",a:"01-01-2024"},
{q:"First Meeting Place?",a:"Murugar Temple"},
{q:"Our Memorable Place?",a:"Light House"}
];

let current=0;

function startQuiz(){
show("quiz");
loadQuestion();
}

function loadQuestion(){
questionText.innerText=questions[current].q;
answerInput.value="";
}

function nextQuestion(){

let val=answerInput.value.trim().toLowerCase();
let ans=questions[current].a.toLowerCase();

if(val===ans){

sparkle();
current++;

if(current<questions.length){
loadQuestion();
}else{

show("blast");

setTimeout(()=>blastText.innerText="🎉 Congratulations Jeeva ❤️",1000);

setTimeout(()=>{
show("game");
initGame();
},3000);

}

}else{
answerInput.style.animation="shake .3s";
setTimeout(()=>answerInput.style.animation="",300);
}

}

/* SPARKLE */
function sparkle(){
for(let i=0;i<25;i++){
let s=document.createElement("div");
s.className="star";
s.innerText="✨";
s.style.left=Math.random()*100+"vw";
s.style.top=Math.random()*100+"vh";
document.body.appendChild(s);

setTimeout(()=>{
s.style.opacity=0;
s.remove();
},800);
}
}

/* MATCH GAME */

const images=[
"img1.jpeg","img1.jpeg",
"img2.jpeg","img2.jpeg",
"img3.jpeg","img3.jpeg",
"img4.jpeg","img4.jpeg",
"img5.jpeg","img5.jpeg"
];

let firstCard=null;
let lock=false;
let matched=0;

function initGame(){

board.innerHTML="";
matched=0;
firstCard=null;
lock=false;

let shuffled=[...images].sort(()=>0.5-Math.random());

shuffled.forEach(src=>{

let card=document.createElement("div");
card.className="card";

let img=document.createElement("img");
img.src=src;

card.appendChild(img);

card.onclick=function(){

if(lock || card.classList.contains("open")) return;

card.classList.add("open");

if(!firstCard){
firstCard=card;
}else{

if(firstCard.querySelector("img").src===img.src){

matched++;
firstCard=null;

if(matched===5){

setTimeout(()=>show("anniversary"),1500);

setTimeout(()=>show("loveFinal"),4000);

}

}else{

lock=true;

setTimeout(()=>{
firstCard.classList.remove("open");
card.classList.remove("open");
firstCard=null;
lock=false;
},800);

}

}

};

board.appendChild(card);

});

}

/* PHOTO SLIDESHOW */

let slides=[
"img1.jpeg",
"img2.jpeg",
"img3.jpeg",
"img4.jpeg",
"img5.jpeg"
];

let slideIndex=0;

setInterval(()=>{

slideIndex++;

if(slideIndex>=slides.length){
slideIndex=0;
}

let slide=document.getElementById("slideshow");

if(slide){
slide.src=slides[slideIndex];
}

},2500);

/* WHATSAPP SHARE */

function shareLove(){

let url=window.location.href;

let text="A small surprise for you ❤️";

window.open("https://wa.me/?text="+encodeURIComponent(text+" "+url));

}

/* FINAL BLAST */

function fullBlast(){

for(let i=0;i<300;i++){

let s=document.createElement("div");

s.className="star";

s.innerText=["✨","💖","⭐"][Math.floor(Math.random()*3)];

s.style.left=Math.random()*100+"vw";
s.style.top=Math.random()*100+"vh";

document.body.appendChild(s);

setTimeout(()=>{
s.style.opacity=0;
s.remove();
},1200);

}

}

</script>

</body>
</html>
```
