<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Our Love Story 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:'Poppins',sans-serif;
background:linear-gradient(135deg,#000,#1a001f,#000);
color:white;
text-align:center;
overflow:hidden;
}

.section{
display:none;
height:100vh;
justify-content:center;
align-items:center;
flex-direction:column;
padding:20px;
}

.active{
display:flex;
}

button{
padding:14px 35px;
border:none;
border-radius:40px;
cursor:pointer;
background:linear-gradient(45deg,#ff0080,#ff4d6d);
color:white;
font-size:17px;
margin-top:20px;
box-shadow:0 0 20px #ff0080;
}

.quiz-box{
padding:40px;
border-radius:25px;
background:rgba(255,255,255,0.05);
border:2px solid rgba(255,0,128,0.5);
}

input{
padding:12px 20px;
border-radius:25px;
border:none;
margin-top:15px;
width:220px;
font-size:16px;
}

.heart{
position:absolute;
font-size:25px;
animation:float 4s linear infinite;
}

@keyframes float{
from{transform:translateY(100vh);}
to{transform:translateY(-10vh);}
}

.blast{
position:absolute;
font-size:30px;
animation:blastAnim 1.5s ease-out forwards;
}

@keyframes blastAnim{
0%{transform:scale(0);opacity:1;}
100%{transform:scale(2) translate(var(--x),var(--y));opacity:0;}
}

.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px;
max-width:340px;
margin-top:20px;
}

.card{
width:70px;
height:70px;
border-radius:20px;
position:relative;
transform-style:preserve-3d;
transition:0.5s;
cursor:pointer;
}

.card.open{
transform:rotateY(180deg);
}

.card-front,
.card-back{
position:absolute;
width:100%;
height:100%;
border-radius:20px;
display:flex;
align-items:center;
justify-content:center;
backface-visibility:hidden;
}

.card-front{
background:#ff0080;
font-size:25px;
}

.card-back{
transform:rotateY(180deg);
}

.card-back img{
width:100%;
height:100%;
object-fit:cover;
border-radius:20px;
}

.gallery img{
width:260px;
border-radius:20px;
box-shadow:0 0 30px #ff0080;
}

.letter{
max-width:500px;
line-height:1.8;
font-size:18px;
min-height:180px;
}

</style>
</head>

<body>

<audio id="music" loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<!-- INTRO -->

<div id="intro" class="section active">
<h1>For Jeeva ❤️</h1>
<h2>From Bhavani</h2>
<button onclick="startJourney()">Start Our Love Story</button>
</div>

<!-- QUIZ -->

<div id="quiz" class="section">

<div class="quiz-box">

<h2 id="questionText"></h2>

<input type="text" id="answerInput" placeholder="Type your answer">

<br>

<button onclick="checkAnswer()">Submit ❤️</button>

<div style="margin-top:20px;width:250px;height:15px;background:#333;border-radius:20px;">
<div id="loveMeter" style="height:100%;width:0%;background:#ff0080;border-radius:20px;"></div>
</div>

<p id="lovePercent">Love Meter ❤️ 0%</p>

</div>

</div>

<!-- MEMORY GAME -->

<div id="game" class="section">

<h2>Match Our Memories 💞</h2>

<div class="grid" id="board"></div>

<div id="anniversaryMessage" style="display:none;font-size:30px;margin-top:20px;color:#ff4d9a;">
Happy 1st Anniversary My Dear ❤️
</div>

</div>

<!-- FINAL QUESTION -->

<div id="final" class="section">

<h1>I Have One Last Question ❤️</h1>

<h2>Will you stay with me forever?</h2>

<button onclick="finalYes()">YES ❤️</button>
<button onclick="finalYes()">FOREVER ❤️</button>

</div>

<!-- GALLERY -->

<div id="gallery" class="section">

<h1>Our Beautiful Memories 📸</h1>

<div class="gallery">
<img id="slide" src="photos/img60.jpeg">
</div>

<button onclick="showLetter()">Next ❤️</button>

</div>

<!-- LETTER -->

<div id="letter" class="section">

<h1>My Love 💌</h1>

<p id="letterText" class="letter"></p>

<img src="photos/img21.jpeg" style="width:200px;border-radius:20px;margin-top:20px;box-shadow:0 0 30px #ff0080;">

</div>

<script>

/* START */

function startJourney(){
document.getElementById("music").play()
show("quiz")
createHearts()
}

/* SHOW PAGE */

function show(id){
document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"))
document.getElementById(id).classList.add("active")
}

/* FLOAT HEARTS */

function createHearts(){
setInterval(()=>{
let h=document.createElement("div")
h.className="heart"
h.innerHTML=["💖","💘","✨"][Math.floor(Math.random()*3)]
h.style.left=Math.random()*100+"vw"
document.body.appendChild(h)
setTimeout(()=>h.remove(),4000)
},300)
}

/* QUIZ */

let love=0

const questions=[
{q:"My Favourite Color? 💙",answer:"Blue"},
{q:"Where did we first meet? ❤️",answer:"Temple"},
{q:"Our Memorable Place? 🌊",answer:"Lighthouse"},
{q:"Who loves you the most? 😜",answer:"Bhavani"}
]

let current=0

function loadQuestion(){

let q=questions[current]

document.getElementById("questionText").innerText=q.q

document.getElementById("answerInput").value=""

}

function checkAnswer(){

let input=document.getElementById("answerInput").value.trim().toLowerCase()

let correct=questions[current].answer.toLowerCase()

if(input===correct){

blastHearts()

love+=25

document.getElementById("loveMeter").style.width=love+"%"
document.getElementById("lovePercent").innerText="Love Meter ❤️ "+love+"%"

current++

if(current<questions.length){

setTimeout(loadQuestion,800)

}else{

setTimeout(()=>{
show("game")
initGame()
},800)

}

}else{

alert("Wrong answer 😜 Try again ❤️")

}

}

loadQuestion()

/* MEMORY GAME */

const images=[

{src:"photos/img1.jpeg",pair:1},
{src:"photos/img2.jpeg",pair:1},

{src:"photos/img11.jpeg",pair:2},
{src:"photos/img15.jpeg",pair:2},

{src:"photos/img18.jpeg",pair:3},
{src:"photos/img28.jpeg",pair:3},

{src:"photos/img19.jpeg",pair:4},
{src:"photos/img29.jpeg",pair:4},

{src:"photos/img4.jpeg",pair:5},
{src:"photos/img31.jpeg",pair:5},

{src:"photos/img13.jpeg",pair:6},
{src:"photos/img20.jpeg",pair:6},

{src:"photos/img22.jpeg",pair:7},
{src:"photos/img14.jpeg",pair:7},

{src:"photos/img53.jpeg",pair:8},
{src:"photos/img54.jpeg",pair:8},

{src:"photos/img32.jpeg",pair:9},
{src:"photos/img42.jpeg",pair:9},

{src:"photos/img6.jpeg",pair:10},
{src:"photos/img41.jpeg",pair:10}
]

let firstCard=null
let lock=false
let matched=0

function initGame(){

let board=document.getElementById("board")

board.innerHTML=""

let shuffled=[...images].sort(()=>0.5-Math.random())

shuffled.forEach(data=>{

let card=document.createElement("div")
card.className="card"

card.innerHTML=`
<div class="card-front">💖</div>
<div class="card-back">
<img src="${data.src}" data-pair="${data.pair}">
</div>
`

card.onclick=function(){

if(lock||card.classList.contains("open")) return

card.classList.add("open")

if(!firstCard){

firstCard=card

}else{

let firstPair=firstCard.querySelector("img").dataset.pair
let secondPair=card.querySelector("img").dataset.pair

if(firstPair===secondPair){

matched++
firstCard=null

if(matched===4){

document.getElementById("anniversaryMessage").style.display="block"

fireworks()

setTimeout(()=>{
show("final")
},2500)

}

}else{

lock=true

setTimeout(()=>{
firstCard.classList.remove("open")
card.classList.remove("open")
firstCard=null
lock=false
},900)

}

}

}

board.appendChild(card)

})

}

/* BLAST */

function blastHearts(){

for(let i=0;i<60;i++){

let el=document.createElement("div")

el.className="blast"

el.innerHTML=Math.random()>0.5?"❤️":"✨"

let x=(Math.random()*600-300)+"px"
let y=(Math.random()*600-300)+"px"

el.style.setProperty("--x",x)
el.style.setProperty("--y",y)

el.style.left="50%"
el.style.top="50%"

document.body.appendChild(el)

setTimeout(()=>el.remove(),1500)

}

}

/* FIREWORKS */

function fireworks(){

for(let i=0;i<120;i++){

let star=document.createElement("div")

star.className="blast"

star.innerHTML=Math.random()>0.5?"✨":"💖"

star.style.left=Math.random()*100+"vw"
star.style.top=Math.random()*100+"vh"

let x=(Math.random()*600-300)+"px"
let y=(Math.random()*600-300)+"px"

star.style.setProperty("--x",x)
star.style.setProperty("--y",y)

document.body.appendChild(star)

setTimeout(()=>star.remove(),1500)

}

}

/* FINAL */

function finalYes(){

fireworks()

setTimeout(()=>{
show("gallery")
},2000)

}

/* SLIDESHOW */

let slides=[
"photos/img60.jpeg",
"photos/img55.jpeg",
"photos/img56.jpeg",
"photos/img57.jpeg",
"photos/img61.jpeg",
"photos/img62.jpeg",
"photos/img63.jpeg"
]

let i=0

setInterval(()=>{

i++

if(i>=slides.length) i=0

let slide=document.getElementById("slide")

if(slide) slide.src=slides[i]

},2500)

/* LETTER */

const text=`One year down… forever to go ❤️

Through every smile, every tear,
every moment — you have been my greatest blessing.

Loving you is the most beautiful thing in my life.

Happy Anniversary my love 💍`

let index=0

function showLetter(){

show("letter")

let interval=setInterval(()=>{

document.getElementById("letterText").innerHTML+=text[index]

index++

if(index>=text.length) clearInterval(interval)

},40)

}

</script>

</body>
</html>
